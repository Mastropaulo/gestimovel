    // Tenta converter via heic2any se disponivel
    const lib = window.heic2any;
    if (!lib) { setFailed(true); return; }

    (async () => {
      try {
        const res = await fetch(src, { mode: "cors" });
        if (cancelled) return;
        const blob = await res.blob();

        const out = Array.isArray(converted) ? converted[0] : converted;
        const url = URL.createObjectURL(out);

    return () => { cancelled = true; };
  };

function gerarPDFVistoria({
  imovel,
  d,
  comodos,
  tipo,
  sigLocatario,
  sigAdministradora
}) {
  const tituloTipo = tipo === "entrada" ? "Laudo de Vistoria de Entrada" : "Laudo de Vistoria de Saída";
  const empresa = "Bonito & Mastropaulo Administração de Bens LTDA";
  const hoje = new Date().toLocaleDateString("pt-BR");
  const comodoHTML = comodos.map((cm, i) => `
    <div class="comodo">
      <h3>${i + 1}. ${cm.nome}</h3>
      <table class="grid">
        <tr>
          <th>Estado geral</th><th>Paredes</th><th>Piso</th><th>Teto</th><th>Portas/Janelas</th>
        </tr>
        <tr>
          <td><strong>${cm.estado_geral}</strong></td>
          <td>${cm.paredes}</td>
          <td>${cm.piso}</td>
          <td>${cm.teto}</td>
          <td>${cm.portas_janelas}</td>
        </tr>
      </table>
      ${cm.obs ? `<p class="obs">Obs: ${cm.obs}</p>` : ""}
      ${cm.fotos.length > 0 ? `
        <p class="fotos-label">Fotos</p>
        <div class="fotos">
          ${cm.fotos.map(f => `<img src="${f.url}" />`).join("")}
        </div>
      ` : ""}
    </div>
  `).join("");
  const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<title>${tituloTipo}</title>
<style>
  body { font-family: Arial, sans-serif; font-size: 12px; color: #333; padding: 30px; }
  h1 { font-size: 18px; margin:0; }
  .sub { font-size: 12px; color: #666; margin-bottom: 20px; }
  .secao { font-weight: bold; color: #C8760A; text-transform: uppercase; font-size: 11px; margin: 16px 0 6px; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  th { background: #f5f5f5; text-align: left; padding: 6px 8px; font-size: 11px; color: #666; border: 1px solid #ddd; }
  td { padding: 6px 8px; border: 1px solid #ddd; }
  .comodo { margin-bottom: 20px; page-break-inside: avoid; }
  .comodo h3 { font-size: 14px; color: #2C6EE8; border-bottom: 2px solid #2C6EE8; padding-bottom: 4px; margin-bottom: 8px; }
  .grid th, .grid td { font-size: 11px; }
  .obs { font-size: 11px; color: #666; margin-top: 4px; }
  .fotos-label { font-size: 10px; color: #999; margin: 6px 0 4px; }
  .fotos { display: flex; flex-wrap: wrap; gap: 6px; }
  .fotos img { width: 150px; height: 120px; object-fit: cover; border: 1px solid #ddd; }
  .assinaturas { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; border-top: 1px solid #ddd; padding-top: 16px; }
  .sig-box { border: 1px solid #ddd; min-height: 80px; display: flex; align-items: flex-end; }
  .sig-box img { max-height: 80px; max-width: 100%; }
  .sig-label { font-size: 11px; color: #666; margin-top: 4px; }
  .rodape { text-align: center; font-size: 10px; color: #999; margin-top: 30px; border-top: 1px solid #eee; padding-top: 10px; }
  @media print { body { padding: 15px; } }
</style>
</head>
<body>
<h1>${empresa}</h1>
<div class="sub">${tituloTipo}</div>
<div class="secao">Dados gerais</div>
<table>
  <tr>
    <th>Imóvel</th><td>${imovel.nome}</td>
    <th>Data/Hora</th><td>${fmtData(d.data)} às ${d.hora || "—"}</td>
  </tr>
  <tr>
    <th>Locatário</th><td>${d.locatario || "—"}</td>
    <th>Chaves</th><td>${d.chaves || 0}</td>
  </tr>
  <tr>
    <th>Acompanhante</th><td>${d.acompanhante || "—"}</td>
    <th>Tipo</th><td>${tipo === "entrada" ? "Entrada" : "Saída"}</td>
  </tr>
</table>
<div class="secao">Cômodos</div>
${comodoHTML}
<div class="assinaturas">
  <div>
    <div class="sig-box">${sigLocatario ? `<img src="${sigLocatario}"/>` : "&nbsp;"}</div>
    <div class="sig-label">Locatário</div>
  </div>
  <div>
    <div class="sig-box">${sigAdministradora ? `<img src="${sigAdministradora}"/>` : "&nbsp;"}</div>
    <div class="sig-label">Locador / Administradora</div>
  </div>
</div>
<div class="rodape">Laudo gerado em ${hoje} · ${empresa}</div>
</body>
</html>`;

  // Tentar compartilhar via Web Share API (funciona no iPad/iPhone)
  if (navigator.share && navigator.canShare) {
    const blob = new Blob([html], {
      type: "text/html"
    });
    const file = new File([blob], "Laudo_Vistoria_" + tipo + "_" + d.data + ".html", {
      type: "text/html"
    });
    if (navigator.canShare({
      files: [file]
    })) {
      navigator.share({
        title: "Laudo de Vistoria — " + imovel.nome,
        text: "Segue o laudo de vistoria de " + tipo + " do imóvel " + imovel.nome,
        files: [file]
      }).catch(() => {});
      return;
    }
  }
  // Fallback: abrir em nova janela para impressão/download
  const w = window.open("", "_blank", "width=900,height=700");
  w.document.write(html);
  w.document.close();
  setTimeout(() => w.print(), 800);
}
